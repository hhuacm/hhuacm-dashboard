name: hhuacm-dashboard

x-app-service: &app-service
  image: ghcr.io/hhuacm/hhuacm-dashboard:${IMAGE_TAG:-main}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

x-db-host-access: &db-host-access
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  web:
    <<: [*app-service, *db-host-access]
    command: ["bun", "apps/web/server.js"]
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
    ports:
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-3001}:3000"

  refresh-worker:
    <<: [*app-service, *db-host-access]
    command: ["bun", "run", "--cwd", "runtime/apps/refresh-worker", "start"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
